# Образ приложения: задайте в .env рядом с этим файлом (APP_IMAGE=...) или export перед командой.
# CI задаёт через export при деплое. Без этого любая команда compose (logs, up) выдаст ошибку.
services:
  app:
    image: ${APP_IMAGE:?Set APP_IMAGE}
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    env_file:
      - .env
    environment:
      - DATABASE_URL=jdbc:postgresql://postgres:5432/travel_planner
      - DATABASE_USER=tp_user
      - DATABASE_PASSWORD=tp_pass
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://minio:9000
      - S3_PUBLIC_ENDPOINT=http://111.88.158.20:9000
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin
      - S3_BUCKET=travel-planner
      - S3_REGION=us-east-1
      - FCM_SERVICE_ACCOUNT_PATH=/app/travelplanner-firebase.json
      - PUBLIC_API_BASE_URL=http://111.88.158.20:8080
      - SMTP_ENABLED=true
      - SMTP_HOST=smtp.yandex.ru
      - SMTP_PORT=465
      - SMTP_TLS_MODE=ssl
      - SMTP_USERNAME=egsubbotina_1@edu.hse.ru
      - SMTP_FROM=egsubbotina_1@edu.hse.ru
      # Одноразовый recovery Flyway (схема уже есть, история пустая/битая): см. README.
      # - FLYWAY_RECOVERY_BASELINE_VERSION=17
    volumes:
      - ./travelplanner-firebase.json:/app/travelplanner-firebase.json:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: travel_planner
      POSTGRES_USER: tp_user
      POSTGRES_PASSWORD: tp_pass
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tp_user -d travel_planner"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:

networks:
  default:
    name: travel-planner_default
