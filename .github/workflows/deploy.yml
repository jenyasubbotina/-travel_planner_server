name: Deploy to Yandex VPS via Docker Hub

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/travel-planner-server

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build-push
    steps:
      - name: Deploy on VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}
            export APP_IMAGE=${{ env.IMAGE_NAME }}:latest
            export COMPOSE_PROJECT_NAME=travel-planner

            # Write runtime env from GitHub Secret.
            cat > .env <<'EOF'
            ${{ secrets.VPS_ENV_FILE }}
            EOF

            # Write Firebase Admin SDK JSON key from GitHub Secret.
            cat > travelplanner-firebase.json <<'EOF'
            ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
            EOF

            chmod 600 .env travelplanner-firebase.json

            if sudo -n docker compose version >/dev/null 2>&1; then
              DC="sudo -n docker compose"
            elif docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            elif sudo -n docker-compose version >/dev/null 2>&1; then
              DC="sudo -n docker-compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              echo "Neither 'docker compose' nor 'docker-compose' found on VPS"
              exit 1
            fi

            # docker-compose v1 can fail on recreate with KeyError('ContainerConfig').
            # Remove app container via docker CLI to avoid compose recreate path.
            sudo -n docker rm -f travel-planner_app_1 >/dev/null 2>&1 || docker rm -f travel-planner_app_1 >/dev/null 2>&1 || true
            $DC -f docker-compose.prod.yml pull app
            $DC -f docker-compose.prod.yml up -d --no-recreate postgres redis minio || true
            $DC -f docker-compose.prod.yml up -d --no-deps app
