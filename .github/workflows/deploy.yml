name: Deploy to Yandex VPS via Docker Hub

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/travel-planner-server

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            CI_GIT_SHA=${{ github.sha }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: docker-build-push
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/travel-planner-server
    steps:
      - name: Deploy on VPS over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.VPS_APP_DIR }}
            export COMPOSE_PROJECT_NAME=travel-planner

            # Sync deployment repo on VPS to latest main branch.
            if [ -d .git ]; then
              git fetch origin main
              git checkout main
              git pull --ff-only origin main
            fi

            # Write runtime env from GitHub Secret.
            cat > .env <<'EOF'
            ${{ secrets.VPS_ENV_FILE }}
            EOF

            # Секрет VPS_ENV_FILE полностью заменяет .env — если в секрете нет строки, её не будет.
            # Подстраховка: APP_IMAGE (ручной docker compose на VPS) и PUBLIC_API_BASE_URL (опц. GitHub Variable).
            if ! grep -q '^APP_IMAGE=' .env; then
              echo "APP_IMAGE=${{ env.IMAGE_NAME }}:${{ github.sha }}" >> .env
            fi
            if [ -n "${{ vars.VPS_PUBLIC_API_BASE_URL }}" ] && ! grep -q '^PUBLIC_API_BASE_URL=' .env; then
              echo "PUBLIC_API_BASE_URL=${{ vars.VPS_PUBLIC_API_BASE_URL }}" >> .env
            fi

            # Write Firebase Admin SDK JSON key from GitHub Secret.
            cat > travelplanner-firebase.json <<'EOF'
            ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
            EOF

            chmod 600 .env travelplanner-firebase.json

            export APP_IMAGE="${{ env.IMAGE_NAME }}:${{ github.sha }}"
            if [ -z "$APP_IMAGE" ] || [ "$APP_IMAGE" = "/travel-planner-server:${{ github.sha }}" ]; then
              echo "APP_IMAGE is invalid — set GitHub secret DOCKERHUB_USERNAME"
              exit 1
            fi

            # sudo по умолчанию сбрасывает env — без -E docker compose не видит APP_IMAGE (${APP_IMAGE:?} падает).
            COMPOSE_V2=0
            if sudo -n docker compose version >/dev/null 2>&1; then
              DC="sudo -n -E docker compose"
              COMPOSE_V2=1
            elif docker compose version >/dev/null 2>&1; then
              DC="docker compose"
              COMPOSE_V2=1
            elif sudo -n docker-compose version >/dev/null 2>&1; then
              DC="sudo -n -E docker-compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              DC="docker-compose"
            else
              echo "Neither 'docker compose' nor 'docker-compose' found on VPS"
              exit 1
            fi

            # docker-compose v1 can fail on recreate with KeyError('ContainerConfig').
            # Remove app container via docker CLI to avoid compose recreate path.
            sudo -n docker rm -f travel-planner_app_1 >/dev/null 2>&1 || docker rm -f travel-planner_app_1 >/dev/null 2>&1 || true
            $DC -f docker-compose.prod.yml pull app
            $DC -f docker-compose.prod.yml up -d --no-recreate postgres redis minio || true
            # v2: без --no-deps — учитывается depends_on + healthcheck (меньше гонок DNS postgres).
            # v1: --no-deps — избегаем массового recreate зависимостей.
            if [ "$COMPOSE_V2" -eq 1 ]; then
              $DC -f docker-compose.prod.yml up -d app
            else
              $DC -f docker-compose.prod.yml up -d --no-deps app
            fi
